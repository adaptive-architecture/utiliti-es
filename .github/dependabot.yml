version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 0 13 * *"
    ignore:
      # typedoc does not support TypeScript 7 yet
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      all:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 6 * *"
    groups:
      all:
        patterns:
          - "*"
